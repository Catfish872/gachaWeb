name: Godot Android
on:
  push:
    branches: ['main', 'godot/**']
    tags: ['android-v*']
    paths: ['godot/**', '.github/workflows/godot-android.yml']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci/config
      XDG_DATA_HOME: ${{ github.workspace }}/.ci/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Godot and Android templates
        run: bash godot/tools/build/install_godot.sh
      - name: Validate version and test game
        run: |
          python3 godot/tools/build/validate_version.py
          bash godot/tools/test_all.sh
          godot --headless --path godot --script tests/test_updates.gd -- --test-session
      - name: Configure Android SDK
        run: bash godot/tools/build/setup_android.sh
      - name: Export isolated debug APK
        run: bash godot/tools/build/export_android.sh debug "$RUNNER_TEMP/apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: void-rift-ci-debug-${{ github.run_number }}
          path: ${{ runner.temp }}/apk/*
          if-no-files-found: error
          retention-days: 14
  signed-release:
    if: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: write
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci/config
      XDG_DATA_HOME: ${{ github.workspace }}/.ci/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Require exact release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 godot/tools/build/validate_version.py --tag "$RELEASE_TAG"
      - name: Install pinned engine and templates
        run: bash godot/tools/build/install_godot.sh
      - name: Run all game tests
        run: |
          bash godot/tools/test_all.sh
          godot --headless --path godot --script tests/test_updates.gd -- --test-session
      - name: Configure SDK
        run: bash godot/tools/build/setup_android.sh
      - name: Export and verify production signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash godot/tools/build/export_android.sh release "$RUNNER_TEMP/apk"
      - name: Publish verified APK (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/apk/universal.apk" "$RUNNER_TEMP/apk/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

name: Godot Android
on:
  push:
    branches: ['main', 'godot/**']
    tags: ['android-v*']
    paths: ['godot/**', '.github/workflows/godot-android.yml', '.github/scripts/**']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot-android.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified fixed-signature Android release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci/config
      XDG_DATA_HOME: ${{ github.workspace }}/.ci/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Godot and Android templates
        run: bash godot/tools/build/install_godot.sh
      - name: Validate version and test game
        run: |
          python3 godot/tools/build/validate_version.py
          python3 .github/scripts/test_release_preflight.py
          python3 godot/tests/test_android_build.py
          python3 godot/tests/test_android_smoke.py
          python3 godot/tests/test_android_kvm.py
          bash godot/tools/test_all.sh
          godot --headless --path godot --script tests/test_mobile_ui.gd -- --test-session --mobile-ui
          godot --headless --path godot --script tests/test_updates.gd -- --test-session --mobile-ui
          godot --headless --path godot --script tests/test_input_dispatch.gd -- --test-session --mobile-ui
      - name: Configure Android SDK
        run: bash godot/tools/build/setup_android.sh
      - name: Export isolated x86_64 emulator test APK
        run: bash godot/tools/android/export_smoke.sh "$RUNNER_TEMP/android-smoke"
      - name: Exercise actual Android runtime with ADB
        env:
          ALLOW_TEMP_KVM_ACL: '1'
        run: bash godot/tools/android/run_emulator.sh "$RUNNER_TEMP/android-smoke/smoke.apk" "$RUNNER_TEMP/android-evidence"
      - name: Save Android screenshots and runtime logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-runtime-evidence-${{ github.job }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/android-evidence/
            ${{ runner.temp }}/android-smoke/*.log
          if-no-files-found: warn
          retention-days: 14
      # Debug APKs are internal emulator fixtures. The user's install channel
      # is the fixed-signature release below, never rotating CI identities.
  signed-release:
    needs: test-debug
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/android-v') ||
           (github.ref == 'refs/heads/godot/android-release-v2' &&
            ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
             vars.ANDROID_RELEASE_ENABLED == 'true'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: write
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci/config
      XDG_DATA_HOME: ${{ github.workspace }}/.ci/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve immutable release identity
        id: release
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          python3 godot/tools/build/validate_version.py
          VERSION=$(python3 -c 'import json; print(json.load(open("godot/data/version.json"))["version_name"])')
          TAG="android-v$VERSION"
          if [[ "$SOURCE_REF" == refs/tags/* && "$SOURCE_REF" != "refs/tags/$TAG" ]]; then
            echo 'Tag does not match tested source version' >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preserve an identical published release or require a version bump
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python3 .github/scripts/release_preflight.py
      - name: Install pinned engine and templates
        if: steps.preflight.outputs.publish == 'true'
        run: bash godot/tools/build/install_godot.sh
      - name: Configure SDK
        if: steps.preflight.outputs.publish == 'true'
        run: bash godot/tools/build/setup_android.sh
      - name: Export and verify production signature
        if: steps.preflight.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash godot/tools/build/export_android.sh release "$RUNNER_TEMP/apk"
      - name: Publish verified APK (never overwrite an existing release)
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/apk/universal.apk" "$RUNNER_TEMP/apk/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
